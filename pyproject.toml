[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-gen-service"
version = "0.1.0"
description = "文生图、图生视频、视频生视频与大模型接入服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35.0"]
dev = ["pytest>=8.3.0"]

[project.scripts]
media-gen = "app.main:run"
media-gen-worker = "app.worker.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
